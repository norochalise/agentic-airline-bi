[project]
name = "agentic-business-intelligence"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "exa-py>=2.22.2",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.141.1",
    "mcp[cli]>=2.2.0",
    "openai>=3.19.2",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_bi"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
testpaths = ["tests"]
