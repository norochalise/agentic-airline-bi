[project]
name = "agentic-business-intelligence"
version = "0.1.0"
description = "Bounded agentic BI assistant over airline flight data, documents and official web sources."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "exa-py>=2.22.2",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.141.1",
    "mcp[cli]>=2.2.0",
    "openai>=3.19.2",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    # Listed so Linux (Docker, CI) can take the CPU-only build; see below.
    "torch>=2.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
abi-serve = "agentic_bi.api.serve:main"
abi-eval-routing = "agentic_bi.evaluation.routing_eval:run_routing_evaluation"
abi-eval-interaction = "agentic_bi.evaluation.interaction_routing_eval:run_interaction_routing_evaluation"
abi-eval-tools = "agentic_bi.evaluation.tool_selection_eval:main"
abi-eval-arguments = "agentic_bi.evaluation.argument_eval:main"
abi-eval-e2e = "agentic_bi.evaluation.agent_end_to_end_eval:main"
abi-eval-analytics = "agentic_bi.evaluation.analytics_eval:main"
abi-eval-retrieval = "agentic_bi.evaluation.retrieval_eval:run_evaluation"
abi-eval-reranked = "agentic_bi.evaluation.improved_retrieval_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# On Linux, take torch from PyTorch's CPU-only index. The default Linux
# wheel bundles CUDA and several GB of NVIDIA libraries this app never
# uses. Windows and macOS wheels from PyPI are already CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_bi"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.format]
# Collapse short calls that were split one argument per line.
skip-magic-trailing-comma = true
# Code blocks in the docs are illustrations; keep their hand alignment.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_bi"]
split-on-trailing-comma = false
